<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Preview Korean Aesthetic</title>
  <desc id="description">Undangan minimalis hangat dengan foto gaya polaroid, serif Cormorant, dan aksen cokelat muda.</desc>
  <rect width="1200" height="800" fill="#f7f4ef"/>

  <!-- Back polaroid, tilted the other way -->
  <g transform="rotate(6 350 420)">
    <rect x="196" y="188" width="330" height="416" fill="#e8dfd8" opacity=".55"/>
    <rect x="188" y="180" width="330" height="416" fill="#ffffff"/>
    <rect x="212" y="204" width="282" height="300" fill="#f0e6dc"/>
    <path d="M212 504c46-52 92-78 138-78s92 26 138 78z" fill="#c4a482" opacity=".35"/>
    <circle cx="300" cy="292" r="34" fill="#c4a482" opacity=".45"/>
    <rect x="212" y="524" width="150" height="9" rx="4" fill="#e8dfd8"/>
  </g>

  <!-- Front polaroid -->
  <g transform="rotate(-5 320 400)">
    <rect x="216" y="248" width="386" height="470" fill="#e8dfd8" opacity=".6"/>
    <rect x="208" y="240" width="386" height="470" fill="#ffffff"/>
    <rect x="236" y="268" width="330" height="336" fill="#f0e6dc"/>
    <path d="M236 604c54-58 108-88 165-88s111 30 165 88z" fill="#c4a482" opacity=".38"/>
    <circle cx="345" cy="366" r="40" fill="#c4a482" opacity=".5"/>
    <text x="401" y="666" fill="#787470" font-family="Georgia,serif" font-size="24" font-style="italic" text-anchor="middle">seoul, 2024</text>
  </g>

  <!-- Eyebrow pill -->
  <rect x="700" y="196" width="300" height="46" rx="23" fill="#f0e6dc"/>
  <text x="850" y="226" fill="#c4a482" font-family="Verdana,Geneva,sans-serif" font-size="17" font-weight="bold" letter-spacing="4" text-anchor="middle">THE WEDDING OF</text>

  <!-- Names -->
  <text x="700" y="404" fill="#3a3836" font-family="Georgia,serif" font-size="96" letter-spacing="1">Raka</text>
  <text x="700" y="512" fill="#3a3836" font-family="Georgia,serif" font-size="96" letter-spacing="1">&amp; Nara</text>

  <!-- Ornamental divider -->
  <path d="M700 566h84" stroke="#c4a482" stroke-width="1.5"/>
  <circle cx="800" cy="566" r="4" fill="#c4a482"/>
  <path d="M816 566h84" stroke="#c4a482" stroke-width="1.5"/>

  <!-- Date and place -->
  <text x="700" y="626" fill="#3a3836" font-family="Verdana,Geneva,sans-serif" font-size="22" letter-spacing="3">10 . 01 . 2027</text>
  <text x="700" y="664" fill="#787470" font-family="Verdana,Geneva,sans-serif" font-size="18">Grand Ballroom, Jakarta</text>
</svg>
