<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Origami — undangan kertas lipat">
    <defs>
        <linearGradient id="or-cream" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8f3e9"/>
            <stop offset="1" stop-color="#efe7d7"/>
        </linearGradient>
        <linearGradient id="or-teal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4bb1a3"/>
            <stop offset="1" stop-color="#2f8f83"/>
        </linearGradient>
        <linearGradient id="or-terra" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dd8a63"/>
            <stop offset="1" stop-color="#c9714b"/>
        </linearGradient>
    </defs>
    <rect width="800" height="1000" fill="url(#or-cream)"/>

    <!-- folded paper triangles -->
    <g opacity="0.9">
        <path d="M0 0 L360 0 L0 300 Z" fill="url(#or-teal)"/>
        <path d="M360 0 L800 0 L800 240 Z" fill="#2f8f83" opacity="0.5"/>
        <path d="M800 240 L800 560 L520 400 Z" fill="url(#or-terra)"/>
        <path d="M0 300 L240 520 L0 700 Z" fill="#c9714b" opacity="0.55"/>
        <path d="M0 1000 L420 1000 L180 760 Z" fill="url(#or-teal)" opacity="0.85"/>
        <path d="M800 1000 L520 1000 L800 720 Z" fill="#2f8f83" opacity="0.45"/>
    </g>

    <!-- centre card -->
    <g transform="translate(400 500) rotate(-2)">
        <rect x="-235" y="-215" width="470" height="430" rx="14" fill="#fffdf7" stroke="#e2d8c4" stroke-width="2"/>
        <rect x="-215" y="-195" width="430" height="390" rx="8" fill="none" stroke="#2f8f83" stroke-width="1.4" opacity="0.6"/>
        <text x="0" y="-105" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="20" letter-spacing="6" fill="#c9714b">UNDANGAN PERNIKAHAN</text>
        <text x="0" y="-10" text-anchor="middle" font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="66" fill="#2a2723">Origami</text>
        <line x1="-120" y1="30" x2="120" y2="30" stroke="#2f8f83" stroke-width="3"/>
        <text x="0" y="85" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="26" fill="#2a2723">RENDRA &amp; ALYA</text>
        <text x="0" y="125" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="17" letter-spacing="3" fill="#7a7266">SABTU, 12 JUNI 2027</text>
        <g transform="translate(0 165)">
            <rect x="-95" y="0" width="190" height="50" rx="10" fill="#2f8f83"/>
            <rect x="-95" y="0" width="95" height="50" rx="10" fill="#3f9e91"/>
            <text x="0" y="32" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="16" letter-spacing="3" fill="#fffdf7">BUKA UNDANGAN</text>
        </g>
    </g>
</svg>
