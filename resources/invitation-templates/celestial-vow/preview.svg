<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Preview Celestial Vow</title>
  <desc id="description">Undangan bertema langit malam: bintang, rasi bintang yang menyala, bulan, dan tipografi klasik dengan aksen emas bintang.</desc>
  <defs>
    <radialGradient id="night" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#131c37"/>
      <stop offset="0.6" stop-color="#0a1023"/>
      <stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <radialGradient id="moon" cx="36%" cy="34%" r="80%">
      <stop offset="0" stop-color="#fdf6e2"/>
      <stop offset="0.62" stop-color="#d8c9a2"/>
      <stop offset="1" stop-color="#a89a76"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8b26a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d8b26a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#night)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="2" opacity="0.9"/>
    <circle cx="260" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="420" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="980" cy="110" r="2.2" opacity="0.9"/>
    <circle cx="1100" cy="220" r="1.4" opacity="0.6"/>
    <circle cx="860" cy="60" r="1.6" opacity="0.75"/>
    <circle cx="180" cy="420" r="1.6" opacity="0.6"/>
    <circle cx="1040" cy="470" r="1.6" opacity="0.6"/>
    <circle cx="640" cy="90" r="1.3" opacity="0.55"/>
    <circle cx="340" cy="300" r="1.4" opacity="0.6"/>
  </g>
  <g fill="#d8b26a">
    <circle cx="900" cy="180" r="2.6"/>
    <circle cx="150" cy="250" r="2.2"/>
    <circle cx="500" cy="110" r="2"/>
    <circle cx="760" cy="300" r="2.2"/>
  </g>

  <!-- Constellation -->
  <g stroke="#d8b26a" stroke-width="1.6" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M760 300 L820 220 L900 260 L980 170 L1030 240"/>
    <path d="M820 220 L850 330 L900 260"/>
  </g>
  <g fill="#fdf6e2">
    <circle cx="760" cy="300" r="4"/>
    <circle cx="820" cy="220" r="5.5"/>
    <circle cx="850" cy="330" r="3.6"/>
    <circle cx="900" cy="260" r="4.6"/>
    <circle cx="980" cy="170" r="6.5"/>
    <circle cx="1030" cy="240" r="4"/>
  </g>

  <!-- Moon -->
  <circle cx="300" cy="200" r="120" fill="url(#glow)"/>
  <circle cx="300" cy="200" r="78" fill="url(#moon)"/>

  <!-- Invitation panel -->
  <rect x="120" y="470" width="960" height="250" rx="20" fill="#0c1428" opacity="0.72"/>
  <rect x="120" y="470" width="960" height="250" rx="20" fill="none" stroke="#d8b26a" stroke-opacity="0.45"/>

  <text x="600" y="540" fill="#d8b26a" font-family="Georgia,serif" font-size="20" letter-spacing="8" text-anchor="middle">UNDANGAN PERNIKAHAN</text>
  <text x="600" y="628" fill="#eef2fb" font-family="Georgia,serif" font-size="66" font-style="italic" text-anchor="middle">Rendra &amp; Alya</text>
  <text x="600" y="676" fill="#c9d4f0" opacity="0.85" font-family="Verdana,Geneva,sans-serif" font-size="17" letter-spacing="4" text-anchor="middle">12 JUNI 2027 · WITA</text>

  <!-- Top-left wordmark -->
  <text x="60" y="72" fill="#eef2fb" font-family="Georgia,serif" font-size="30" font-style="italic" opacity="0.9">Celestial Vow</text>
  <text x="62" y="98" fill="#d8b26a" font-family="Verdana,Geneva,sans-serif" font-size="13" letter-spacing="4" opacity="0.9">THE SKY WRITES YOUR NAMES</text>

  <!-- Palette chips -->
  <g>
    <circle cx="1100" cy="740" r="20" fill="#d8b26a" stroke="#0c1428" stroke-width="3"/>
    <circle cx="1052" cy="740" r="20" fill="#c9d4f0" stroke="#0c1428" stroke-width="3"/>
    <circle cx="1004" cy="740" r="20" fill="#131b33" stroke="#0c1428" stroke-width="3"/>
    <circle cx="956" cy="740" r="20" fill="#070b18" stroke="#c9d4f0" stroke-width="2"/>
  </g>
</svg>
