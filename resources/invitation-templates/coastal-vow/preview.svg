<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Preview Coastal Vow</title>
  <desc id="description">Undangan bergaya pesisir: cakrawala laut, ombak lembut, dan tipografi serif hangat dengan aksen warna kaca laut.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8eeef"/>
      <stop offset="0.42" stop-color="#8ecdd1"/>
      <stop offset="0.72" stop-color="#2f7d7b"/>
      <stop offset="1" stop-color="#123f42"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Sun on the horizon -->
  <circle cx="820" cy="250" r="120" fill="#ffe6b0" opacity="0.85"/>
  <circle cx="820" cy="250" r="180" fill="#ffe6b0" opacity="0.18"/>

  <!-- Soft horizon band -->
  <rect x="0" y="430" width="1200" height="2" fill="#eafbfa" opacity="0.4"/>

  <!-- Tide lines -->
  <path d="M0,560 C200,520 380,600 600,570 C820,540 1000,620 1200,580 L1200,800 L0,800 Z" fill="#eafbfa" opacity="0.22"/>
  <path d="M0,640 C220,600 420,680 640,650 C860,620 1020,690 1200,660 L1200,800 L0,800 Z" fill="#eafbfa" opacity="0.4"/>
  <path d="M0,720 C260,690 460,750 700,725 C940,700 1060,750 1200,730 L1200,800 L0,800 Z" fill="#f7f1e2" opacity="0.85"/>

  <!-- Invitation panel -->
  <rect x="120" y="120" width="560" height="520" rx="18" fill="#fbf8f1" opacity="0.96"/>
  <rect x="120" y="120" width="560" height="520" rx="18" fill="none" stroke="#2b7a78" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="150" y="150" width="500" height="460" rx="10" fill="none" stroke="#2b7a78" stroke-opacity="0.22"/>

  <!-- Eyebrow -->
  <text x="400" y="230" fill="#2b7a78" font-family="Georgia,serif" font-size="20" letter-spacing="6" text-anchor="middle">UNDANGAN PERNIKAHAN</text>

  <!-- Names -->
  <text x="400" y="340" fill="#163a3c" font-family="Georgia,serif" font-size="68" font-style="italic" text-anchor="middle">Anindya</text>
  <text x="400" y="390" fill="#e08a6b" font-family="Georgia,serif" font-size="40" font-style="italic" text-anchor="middle">&amp;</text>
  <text x="400" y="460" fill="#163a3c" font-family="Georgia,serif" font-size="68" font-style="italic" text-anchor="middle">Bagaskara</text>

  <!-- Date -->
  <text x="400" y="530" fill="#5f7a78" font-family="Verdana,Geneva,sans-serif" font-size="18" letter-spacing="3" text-anchor="middle">12 · 12 · 2027</text>

  <!-- CTA pill -->
  <rect x="285" y="560" width="230" height="54" rx="27" fill="#2b7a78"/>
  <text x="400" y="594" fill="#f7f4ec" font-family="Verdana,Geneva,sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">BUKA UNDANGAN</text>

  <!-- Theme name on the shore -->
  <text x="880" y="150" fill="#f3fbfa" font-family="Georgia,serif" font-size="54" font-style="italic" text-anchor="middle">Coastal Vow</text>
  <text x="880" y="186" fill="#f3fbfa" opacity="0.8" font-family="Verdana,Geneva,sans-serif" font-size="16" letter-spacing="4" text-anchor="middle">TIDE LINES</text>

  <!-- Palette chips -->
  <g>
    <rect x="782" y="640" width="46" height="46" rx="23" fill="#2b7a78" stroke="#fbf8f1" stroke-width="3"/>
    <rect x="840" y="640" width="46" height="46" rx="23" fill="#123f42" stroke="#fbf8f1" stroke-width="3"/>
    <rect x="898" y="640" width="46" height="46" rx="23" fill="#f0d9a8" stroke="#fbf8f1" stroke-width="3"/>
    <rect x="956" y="640" width="46" height="46" rx="23" fill="#e08a6b" stroke="#fbf8f1" stroke-width="3"/>
  </g>
</svg>
