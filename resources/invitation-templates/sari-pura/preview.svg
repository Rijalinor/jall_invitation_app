<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sari Pura — gilded Balinese wedding invitation</title>
  <desc id="desc">A deep temple-emerald cover framed in metallic gold, with a monogram seal and the couple's names.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7326"/>
      <stop offset="0.45" stop-color="#d8b45a"/>
      <stop offset="0.6" stop-color="#f6e6b8"/>
      <stop offset="0.78" stop-color="#d8b45a"/>
      <stop offset="1" stop-color="#9a7326"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a20" stop-opacity="0"/>
      <stop offset="1" stop-color="#081813" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0e2a20"/>
  <path d="M600 60c-120 92-120 190 0 282s120 190 0 282-120 92 0 116M600 60c120 92 120 190 0 282s-120 190 0 282 120 92 0 116" fill="none" stroke="#ecd9a3" stroke-width="2" opacity="0.16"/>
  <rect width="1200" height="800" fill="url(#shade)"/>

  <rect x="56" y="56" width="1088" height="688" fill="none" stroke="#9a7326" stroke-width="2"/>
  <rect x="80" y="80" width="1040" height="640" fill="none" stroke="#b9944e" stroke-width="1" opacity="0.7"/>

  <circle cx="600" cy="168" r="54" fill="none" stroke="#d8b45a" stroke-width="2"/>
  <circle cx="600" cy="168" r="43" fill="none" stroke="#b9944e" stroke-width="1" opacity="0.6"/>
  <text x="600" y="181" fill="#ecd9a3" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="600">A · K</text>

  <text x="600" y="270" fill="#ecd9a3" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="19" letter-spacing="9">UNDANGAN PERNIKAHAN</text>

  <text x="600" y="372" fill="#fbf6ea" text-anchor="middle" font-family="Georgia,serif" font-size="94">Aksara</text>
  <text x="600" y="438" fill="#d8b45a" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-style="italic">&amp;</text>
  <text x="600" y="520" fill="#fbf6ea" text-anchor="middle" font-family="Georgia,serif" font-size="94">Kirana</text>

  <rect x="540" y="558" width="120" height="3" fill="url(#gold)"/>
  <text x="600" y="612" fill="#d8cbb0" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="20" letter-spacing="2">12 Juni 2027 · Ubud, Bali</text>

  <rect x="465" y="650" width="270" height="58" fill="url(#gold)"/>
  <text x="600" y="687" fill="#21180a" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="18" letter-spacing="3">BUKA UNDANGAN</text>

  <circle cx="300" cy="150" r="9" fill="#d8b45a" opacity="0.5"/>
  <circle cx="930" cy="640" r="7" fill="#ecd9a3" opacity="0.45"/>
</svg>
