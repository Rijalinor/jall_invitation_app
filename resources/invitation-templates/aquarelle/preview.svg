        <text x="400" y="670" font-size="19" letter-spacing="3" font-family="'Nunito Sans', sans-serif" fill="#8b8078">SABTU, 12 JUNI 2027</text>
        <rect x="305" y="720" width="190" height="54" rx="27" fill="#d98ba3"/>
        <text x="400" y="754" font-size="17" letter-spacing="3" font-family="'Nunito Sans', sans-serif" fill="#fffdf9">BUKA UNDANGAN</text>
