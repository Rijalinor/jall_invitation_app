<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Aquarelle — undangan cat air pastel">
    <defs>
        <filter id="aq-blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="60"/>
        </filter>
        <filter id="aq-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="26"/>
        </filter>
    </defs>
    <rect width="800" height="1000" fill="#fbf7f0"/>
    <g filter="url(#aq-blur)">
        <ellipse cx="250" cy="300" rx="230" ry="180" fill="#f2c3cf"/>
        <ellipse cx="580" cy="240" rx="190" ry="160" fill="#cfe0d0"/>
        <ellipse cx="560" cy="700" rx="240" ry="190" fill="#c9dcec"/>
        <ellipse cx="230" cy="760" rx="200" ry="160" fill="#f6d6bf"/>
