<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Preview Tenun Pusaka</title>
  <desc id="description">Undangan bernuansa tenun Indonesia: dua panel kain gelap yang terbuka, aksen indigo dan kunyit, dengan pita tenun terpola.</desc>

  <defs>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#26405f"/>
      <rect width="1" height="12" fill="#3d5c80"/>
      <rect width="12" height="1" fill="#1f3651"/>
    </pattern>
    <pattern id="band" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c98b2e"/>
      <rect width="7" height="7" fill="#2b211a"/>
      <rect x="7" y="7" width="7" height="7" fill="#2b211a" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#efe7d8"/>

  <!-- Two cloth panels, parted by a thin gap: the couple, and the loom -->
  <rect x="72" y="72" width="518" height="560" fill="url(#weave)"/>
  <rect x="610" y="72" width="518" height="560" fill="url(#weave)"/>
  <rect x="596" y="72" width="8" height="560" fill="#c98b2e"/>

  <!-- Cotton inset carrying the names -->
  <rect x="150" y="182" width="900" height="340" fill="#faf6ee"/>
  <rect x="150" y="182" width="900" height="340" fill="none" stroke="#2b211a" stroke-width="1.5" opacity=".35"/>

  <text x="600" y="248" fill="#c98b2e" font-family="Arial,sans-serif" font-size="17" letter-spacing="7" text-anchor="middle">UNDANGAN PERNIKAHAN</text>
  <text x="600" y="368" fill="#2b211a" font-family="Georgia,serif" font-size="76" text-anchor="middle">Anindya</text>
  <text x="600" y="428" fill="#c98b2e" font-family="Georgia,serif" font-size="40" text-anchor="middle">&amp;</text>
  <text x="600" y="494" fill="#2b211a" font-family="Georgia,serif" font-size="76" text-anchor="middle">Bagaskara</text>

  <!-- Woven band and date -->
  <rect x="72" y="652" width="1056" height="34" fill="url(#band)"/>
  <text x="600" y="716" fill="#2b211a" font-family="Arial,sans-serif" font-size="19" letter-spacing="5" text-anchor="middle">SABTU, 10 OKTOBER 2026</text>
  <text x="72" y="768" fill="#6b5c4c" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">TENUN PUSAKA</text>
</svg>
